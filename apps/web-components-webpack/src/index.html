<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Carbon next: Web Components + webpack</title>
  </head>
  <body>
    <main class="page">
      <cds-tile data-testid="tile"
        >Published packages render in a webpack app</cds-tile
      >
      <cds-button data-testid="primary-button" id="open-modal"
        >Open modal</cds-button
      >
      <cds-tag data-testid="tag" type="green">v12</cds-tag>
      <cds-toggle data-testid="toggle" label-text="Enable"></cds-toggle>
      <cds-search label-text="Search" placeholder="Search"></cds-search>
      <cds-tabs value="one">
        <cds-tab id="tab-one" target="panel-one" value="one">One</cds-tab>
        <cds-tab id="tab-two" target="panel-two" value="two">Two</cds-tab>
      </cds-tabs>
      <cds-structured-list>
        <cds-structured-list-head>
          <cds-structured-list-header-row>
            <cds-structured-list-header-cell
              >Name</cds-structured-list-header-cell
            >
          </cds-structured-list-header-row>
        </cds-structured-list-head>
        <cds-structured-list-body>
          <cds-structured-list-row>
            <cds-structured-list-cell>Row</cds-structured-list-cell>
          </cds-structured-list-row>
        </cds-structured-list-body>
      </cds-structured-list>
      <cds-modal id="modal">
        <cds-modal-header>
          <cds-modal-close-button></cds-modal-close-button>
          <cds-modal-heading>Modal</cds-modal-heading>
        </cds-modal-header>
        <cds-modal-body>Modal content</cds-modal-body>
      </cds-modal>
    </main>
  </body>
</html>
