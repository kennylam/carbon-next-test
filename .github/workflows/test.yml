name: Test Carbon next

on:
  # Fallback for releases that did not dispatch; skipped when the release set
  # already passed.
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag to test (ignored when ref is set)
        default: v12-alpha
      ref:
        description: Upstream git tag or commit to read the release set from
        required: false
  # Sent by carbon-design-system/carbon after publishing. client_payload:
  #   ref      git tag or commit the packages were published from (required)
  #   sha      commit to report a status on (optional)
  #   run_id   workflow run with a `carbon-tarballs` artifact, for testing
  #            unpublished commits (optional)
  repository_dispatch:
    types: [carbon-published]
  pull_request:
  push:
    branches: [main]

concurrency:
  group:
    test-${{ github.event_name }}-${{ github.event.client_payload.ref ||
    github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve release set
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.key.outputs.key }}
      tested: ${{ steps.tested.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Download unpublished tarballs
        if: github.event.client_payload.run_id
        env:
          GH_TOKEN: ${{ secrets.CARBON_REPO_TOKEN }}
        run: >
          gh run download ${{ github.event.client_payload.run_id }} --repo
          carbon-design-system/carbon --name carbon-tarballs --dir
          carbon-tarballs
      - name: Resolve
        id: release
        env:
          TAG: ${{ inputs.tag || 'v12-alpha' }}
          REF: ${{ inputs.ref || github.event.client_payload.ref }}
          RUN_ID: ${{ github.event.client_payload.run_id }}
        run: |
          if [ -n "$RUN_ID" ]; then
            node scripts/use-carbon.mjs --tarballs carbon-tarballs --git-ref "$REF"
          elif [ -n "$REF" ]; then
            node scripts/use-carbon.mjs --ref "$REF"
          else
            node scripts/use-carbon.mjs --tag "$TAG"
          fi
          {
            echo '## Release set'
            echo '```json'
            cat carbon-release.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Cache key
        id: key
        run:
          echo "key=tested-${{ hashFiles('carbon-release.json', 'yarn.lock',
          'apps/**', 'tests/**', 'scripts/**') }}" >> "$GITHUB_OUTPUT"
      - name: Check whether this set already passed
        id: tested
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: carbon-release.json
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            carbon-release.json
            carbon-tarballs/
          if-no-files-found: ignore

  contract:
    name: Package contract
    needs: resolve
    if: needs.resolve.outputs.tested != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: ./.github/actions/install
        with:
          react: 19
      - run: yarn test:contract
      - name: Report public API changes
        if: always()
        run:
          cat reports/api-diff.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

  apps:
    name: Apps (React ${{ matrix.react }})
    needs: resolve
    if: needs.resolve.outputs.tested != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - react: 19
            apps: react-vite,react-nextjs,web-components-vite,web-components-webpack,styles-sass
          # Next.js 16 requires React 19, and the other apps do not use React.
          - react: 18
            apps: react-vite
    env:
      APPS: ${{ matrix.apps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: ./.github/actions/install
        with:
          react: ${{ matrix.react }}
      - name: Build
        run: |
          for app in ${APPS//,/ }; do
            echo "::group::$app"
            yarn workspace "@carbon-next-test/$app" build
            echo "::endgroup::"
          done
          cat reports/sass.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - name: Unit tests
        run: yarn test:unit
      - name: Install Playwright
        run:
          yarn workspace @carbon-next-test/e2e playwright install --with-deps
          chromium
      - name: End-to-end tests
        run: |
          export APPS="$(echo "$APPS" | tr ',' '\n' | grep -v '^styles-sass$' | paste -sd, -)"
          yarn test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-react-${{ matrix.react }}
          path: tests/e2e/playwright-report

  report:
    name: Report
    needs: [resolve, contract, apps]
    if: always() && needs.resolve.outputs.tested != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Result
        id: result
        run: |
          if [ "${{ needs.contract.result }}" = success ] && [ "${{ needs.apps.result }}" = success ]; then
            echo "state=success" >> "$GITHUB_OUTPUT"
          else
            echo "state=failure" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.result.outputs.state == 'success'
        with:
          name: release
      - name: Remember that this set passed
        if: steps.result.outputs.state == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: carbon-release.json
          key: ${{ needs.resolve.outputs.key }}
      - name: Report status upstream
        if: github.event.client_payload.sha
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.CARBON_REPO_TOKEN }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: 'carbon-design-system',
              repo: 'carbon',
              sha: context.payload.client_payload.sha,
              state: '${{ steps.result.outputs.state }}',
              context: 'carbon-next-test',
              description: 'Published packages in consumer apps',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
      - name: Notify Slack
        if: >
          steps.result.outputs.state == 'failure' && github.event_name !=
          'pull_request'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          [ -z "$SLACK_WEBHOOK_URL" ] && exit 0
          curl -sS -X POST -H 'Content-type: application/json' "$SLACK_WEBHOOK_URL" \
            --data "{\"text\":\"carbon-next-test failed for ${{ github.event.client_payload.ref || inputs.ref || inputs.tag || 'v12-alpha' }}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
